[project]
name = "modal-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jQN", email = "overstacked@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.8",
    "modal>=0.73.59",
    "openai>=1.63.2",
    "pillow>=11.1.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.3",
    "sentence-transformers>=3.4.1",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
modal-app = "modal_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
